---
prelude: >
    The LINSTOR driver for Cinder has been rewritten from scratch to use the
    high-level python-linstor API bindings. The new driver (version 2.0.0)
    replaces the previous implementation with a cleaner architecture, better
    LINSTOR integration, and several new features while maintaining backward
    compatibility with volumes created by the previous driver version.
features:
  - |
    LINSTOR driver: Cinder Volume Types now map directly to LINSTOR Resource
    Groups, allowing administrators to dynamically configure replica counts,
    DRBD settings, and storage pool selection per volume type without code
    changes. LINSTOR-specific options are exposed as ``linstor:*`` vendor
    properties.
  - |
    LINSTOR driver: Added support for multiple LINSTOR controller URIs via the
    ``linstor_uris`` configuration option, enabling high availability setups
    with load balancers or multiple controllers.
  - |
    LINSTOR driver: Added volume-backed live migration support for directly
    attached DRBD volumes.
  - |
    LINSTOR driver: Added multi-attach support for iSCSI exported volumes.
  - |
    LINSTOR driver: Added snapshot revert support.
  - |
    LINSTOR driver: Added assisted retype and migration between LINSTOR
    backends.
  - |
    LINSTOR driver: Added ``linstor_hostname_file`` configuration option to
    read the LINSTOR satellite hostname from a file, useful for environments
    where the Cinder host name does not match the LINSTOR satellite name.
  - |
    LINSTOR driver: Added TLS/SSL support for LINSTOR API connections via
    ``linstor_client_key``, ``linstor_client_cert``, and
    ``linstor_trusted_ca`` configuration options.
  - |
    LINSTOR driver: The driver now dynamically manages local volume access.
    When a volume needs to be available on the Cinder host for image copy or
    iSCSI export, the driver automatically deploys a temporary local replica
    and removes it when the operation completes. This replaces the old
    driver's reliance on the ``DisklessOnRemaining`` LINSTOR option, which
    is no longer supported and which permanently placed diskless replicas on
    every node in the cluster.
upgrade:
  - |
    LINSTOR driver: The driver has been rewritten from scratch (version 2.0.0).
    Existing volumes and snapshots created by the previous driver version are
    still accessible through automatic fallback name lookups (``CV_<id>`` and
    ``SN_<id>`` naming conventions). New volumes use Cinder's native naming.
  - |
    LINSTOR driver: LINSTOR storage pool configuration is no longer managed
    automatically by the driver. Administrators must configure storage pools
    in LINSTOR before using the driver. This change improves reliability in
    production environments where the automatic configuration rarely worked
    correctly.
  - |
    LINSTOR driver: The driver now requires LINSTOR 1.4.0 or later and the
    python-linstor package with ``MultiLinstor`` support.
  - |
    LINSTOR driver: The previous ``linstor_autoplace_count`` configuration
    option has been removed. Replica counts are now configured through LINSTOR
    Resource Groups, which can be set per volume type using the
    ``linstor:redundancy`` vendor property.
  - |
    LINSTOR driver: The ``linstor_default_resource_group_name`` option
    defaults to ``DfltRscGrp``. Administrators should ensure this resource
    group exists in LINSTOR or configure a custom default.
  - |
    LINSTOR driver: The compatibility driver classes ``LinstorDrbdDriver``
    and ``LinstorIscsiDriver`` are still available for existing configurations,
    mapping to the unified ``LinstorDriver`` with the appropriate transport
    mode.
fixes:
  - |
    LINSTOR driver: Fixed iSCSI export being completely broken in the old
    driver. The previous ``LinstorIscsiDriver`` referenced the ``iscsi_helper``
    configuration option, which was never registered by the driver. This
    caused ``safe_get`` to return ``None``, resulting in a ``None``
    dereference when attempting to look up the target helper. The new driver
    delegates iSCSI export to the standard Cinder target helpers, which
    handle configuration correctly.
